# Throwaway services for the contract tests (docs/SPEC-contract-spike.md). Test equipment only:
# zimuarr itself never talks to Sonarr or Radarr. `setup.ts` starts this with its own project name
# and the variables below (from `.state/compose.env`); `contract:down` removes it. Every image is
# pinned as a multi-platform tag and digest, and setup checks each running version against its pin.
name: zimuarr-contract

x-hotio: &hotio
  environment:
    PUID: ${CONTRACT_UID:?}
    PGID: ${CONTRACT_GID:?}
    UMASK: "002"
    TZ: Etc/UTC
  extra_hosts: ["host.docker.internal:host-gateway"]

x-bazarr: &bazarr
  <<: *hotio
  image: ghcr.io/hotio/bazarr:release-1.6.2@sha256:fb2a7981ca0ac91ce11660469da7b4df7fd104bc583009de0004e123f9e0fa8e
  ports: ["127.0.0.1::6767"]

services:
  sonarr:
    <<: *hotio
    image: ghcr.io/hotio/sonarr:release-4.0.20.3014@sha256:4b7d2569dcae81bd29c558c2db68f3de46db3422f93f56645b1f4068084e1aa9
    volumes:
      - ${CONTRACT_STATE:?}/sonarr:/config
      - ${CONTRACT_MEDIA:?}:${CONTRACT_MEDIA:?}
    ports: ["127.0.0.1::8989"]

  radarr:
    <<: *hotio
    image: ghcr.io/hotio/radarr:release-6.4.4.10685@sha256:647739a4986843ce9b73048425e4427772f867ed272fd512e73c6ec67c5ef5cf
    volumes:
      - ${CONTRACT_STATE:?}/radarr:/config
      - ${CONTRACT_MEDIA:?}:${CONTRACT_MEDIA:?}
    ports: ["127.0.0.1::7878"]

  # One Bazarr per path to zimuarr: each Lingarr address points at its own port of the recording
  # proxy on the host, which forwards to zimuarr directly, to Caddy or to nginx.
  bazarr-direct:
    <<: *bazarr
    volumes:
      - ${CONTRACT_STATE:?}/bazarr-direct:/config
      - ${CONTRACT_MEDIA:?}:${CONTRACT_MEDIA:?}

  bazarr-caddy:
    <<: *bazarr
    volumes:
      - ${CONTRACT_STATE:?}/bazarr-caddy:/config
      - ${CONTRACT_MEDIA:?}:${CONTRACT_MEDIA:?}

  bazarr-nginx:
    <<: *bazarr
    volumes:
      - ${CONTRACT_STATE:?}/bazarr-nginx:/config
      - ${CONTRACT_MEDIA:?}:${CONTRACT_MEDIA:?}

  # The reverse proxies run their default configuration with response compression on.
  caddy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    environment:
      UPSTREAM: host.docker.internal:${CONTRACT_ZIMUARR_PORT:?}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./caddy/Caddyfile:/etc/caddy/Caddyfile:ro"]
    ports: ["127.0.0.1::8080"]

  nginx:
    image: nginx:1.31.8@sha256:165ddde8751e75a1c907d24ef10d9f6deb08b57e0fe56caf67512486aff76d82
    environment:
      UPSTREAM: host.docker.internal:${CONTRACT_ZIMUARR_PORT:?}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro"]
    ports: ["127.0.0.1::8080"]

  # Run once by setup to make the dummy videos.
  ffmpeg:
    profiles: [tools]
    image: lscr.io/linuxserver/ffmpeg:9.0.2-cli-ls88@sha256:f4191c1abe18d75c49a23f7224d1403d55334f80013a47cb096f5056cf19617b
    user: ${CONTRACT_UID:?}:${CONTRACT_GID:?}
    volumes:
      - ${CONTRACT_MEDIA:?}:${CONTRACT_MEDIA:?}
