# SPDX-License-Identifier: AGPL-3.0-only
# Copy as .github/workflows/ci.yml; adapt commands, directories and runners to the repo.
# Give each repo its own weekly minute. Every added PR job belongs in ci-ok. No paths: filter:
# a skipped workflow leaves the required checks pending.
# Bun only: a bare bin runs its `#!/usr/bin/env node` with the runner's Node, so scripts run with
# `bun run --bun`, bins with `bunx --bun`, and lifecycle scripts call `bun --bun <bin>` (bun ci
# ignores --bun there, oven-sh/bun#44584).
name: CI
on:
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:
  schedule: [{ cron: "7 5 * * 0" }]   # weekly audit + main revalidation; minute unique per repo
permissions: {}
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || format('ci-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version-file: package.json }
      - name: Fail on node, npm and npx (Bun only)
        run: |
          mkdir -p "$RUNNER_TEMP/bun-only"
          for tool in node npm npx; do
            printf '#!/bin/sh\necho "::error::%s called; run it under Bun (--bun)" >&2\nexit 97\n' "$tool" > "$RUNNER_TEMP/bun-only/$tool"
            chmod +x "$RUNNER_TEMP/bun-only/$tool"
          done
          echo "$RUNNER_TEMP/bun-only" >> "$GITHUB_PATH"
      - run: bun ci
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with: { extra-args: "--all-files --hook-stage manual" }
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version-file: package.json }
      - name: Fail on node, npm and npx (Bun only)
        run: |
          mkdir -p "$RUNNER_TEMP/bun-only"
          for tool in node npm npx; do
            printf '#!/bin/sh\necho "::error::%s called; run it under Bun (--bun)" >&2\nexit 97\n' "$tool" > "$RUNNER_TEMP/bun-only/$tool"
            chmod +x "$RUNNER_TEMP/bun-only/$tool"
          done
          echo "$RUNNER_TEMP/bun-only" >> "$GITHUB_PATH"
      - run: bun ci
      - run: bunx --bun playwright install --with-deps chromium
      - run: bun run --bun build
      - run: bun run --bun smoke
  # The Bazarr contract tests (docs/SPEC.md, "CI and repo tooling"): a departure from the template
  # approved with that spec. The job always runs and picks its cases itself, so a docs-only PR
  # passes as not applicable instead of leaving a required check pending.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 2 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version-file: package.json }
      - name: Fail on node, npm and npx (Bun only)
        run: |
          mkdir -p "$RUNNER_TEMP/bun-only"
          for tool in node npm npx; do
            printf '#!/bin/sh\necho "::error::%s called; run it under Bun (--bun)" >&2\nexit 97\n' "$tool" > "$RUNNER_TEMP/bun-only/$tool"
            chmod +x "$RUNNER_TEMP/bun-only/$tool"
          done
          echo "$RUNNER_TEMP/bun-only" >> "$GITHUB_PATH"
      - name: Choose the cases this run needs
        id: select
        env: { EVENT: "${{ github.event_name }}" }
        run: |
          # On a pull request HEAD is GitHub's merge commit; HEAD^1 is the base. Anything that
          # can't be listed runs every case.
          changed=""
          if [ "$EVENT" = pull_request ] && git rev-parse -q --verify HEAD^2 >/dev/null \
            && git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"; then
            changed="$RUNNER_TEMP/changed.txt"
          fi
          # Captured first, so a failing selector fails the job instead of selecting nothing.
          tier="$(bun tests/contract/select.ts "$EVENT" ${changed:+"$changed"})"
          echo "$tier" | tee -a "$GITHUB_OUTPUT"
      - if: steps.select.outputs.tier != 'none'
        run: bun ci
      - if: steps.select.outputs.tier != 'none'
        run: bun run --bun contract:up
      - if: steps.select.outputs.tier == 'default'
        run: bun run --bun contract
      - if: steps.select.outputs.tier == 'full'
        run: bun run --bun contract:full
      - name: Collect the services' logs, keys redacted
        if: always() && steps.select.outputs.tier != 'none'
        run: bun tests/contract/setup.ts logs test-results/contract/services.log
      - name: Note a run with nothing to test
        if: steps.select.outputs.tier == 'none'
        run: |
          mkdir -p test-results/contract
          echo "not applicable: only docs and images changed" > test-results/contract/summary.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: contract-evidence
          path: test-results/contract/
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove the throwaway services
        if: always() && steps.select.outputs.tier != 'none'
        run: bun run --bun contract:down
  ci-ok:
    if: always()
    needs: [checks, smoke, contract]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ""
        run: |
          jq -e --arg skips "$ALLOWED_SKIPS" '
            ($skips | split(",") | map(select(. != ""))) as $allowed
            | length > 0 and all(to_entries[]; .value.result == "success"
                or (.value.result == "skipped" and (.key | IN($allowed[]))))
          ' <<<"$NEEDS" >/dev/null || { echo "::error::ci-ok failed: $(jq -c 'map_values(.result)' <<<"$NEEDS")"; exit 1; }
  audit:
    if: github.event_name != 'pull_request'
    strategy: { fail-fast: false, matrix: { dir: ["."] } }
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    defaults: { run: { working-directory: "${{ matrix.dir }}" } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version-file: "${{ matrix.dir }}/package.json" }
      - run: bun audit --audit-level=high
