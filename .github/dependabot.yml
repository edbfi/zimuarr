# Copy as .github/dependabot.yml; match directories to the CI audit matrices.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Copenhagen }
    cooldown: { exclude: ["*"] } # zizmor: ignore[dependabot-cooldown] -- updates merge on green without delay
    commit-message: { prefix: chore, include: scope }
    groups:
      patch-minor: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: pre-commit
    directory: /
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Copenhagen }
    cooldown: { exclude: ["*"] } # zizmor: ignore[dependabot-cooldown] -- updates merge on green without delay
    commit-message: { prefix: chore, include: scope }
    groups:
      patch-minor: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Copenhagen }
    cooldown: { exclude: ["*"] } # zizmor: ignore[dependabot-cooldown] -- updates merge on green without delay
    commit-message: { prefix: chore, include: scope }
    groups:
      biome: { patterns: ["@biomejs/*"] }
      playwright: { patterns: [playwright, "@playwright/*"] }
      vitest: { patterns: [vitest, "@vitest/*"] }
      patch-minor: { patterns: ["*"], update-types: [minor, patch] }
  # The contract tests' pinned images (docs/SPEC.md, "CI and repo tooling"): each update runs every
  # contract case and merges only when they pass. Ungrouped, so a Bazarr release is its own PR (D22).
  - package-ecosystem: docker-compose
    directory: /tests/contract
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Copenhagen }
    cooldown: { exclude: ["*"] } # zizmor: ignore[dependabot-cooldown] -- updates merge on green without delay
    commit-message: { prefix: chore, include: scope }
